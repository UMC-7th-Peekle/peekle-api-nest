name: Deploy to Mac Mini With Docker

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-docker-image-and-push:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. QEMU 설정 (다른 아키텍처 에뮬레이션)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Docker Buildx 빌더 설정 (가장 중요)
      # ⭐️ 이 스텝이 누락되면 질문하신 에러가 발생합니다.
      # (이 스텝이 multi-arch를 지원하는 드라이버로 자동 전환해 줍니다.)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. Docker Hub 로그인 (GitHub Secrets 사용)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Docker 이미지 빌드 및 푸시
      # 위에서 작성한 Dockerfile을 사용하여 이미지를 빌드하고 태깅하여 푸시합니다.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/ec2-dev/dockerfile
          push: true # 빌드 후 푸시 실행
          tags: peekle/peekle-develop:latest
          platforms: linux/amd64,linux/arm64
  docker-pull-and-run:
    name: Pull Latest Docker Image and Run on Mac Mini
    needs: build-docker-image-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH 접속 및 스크립트 실행
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.MAC_MINI_SSH_HOST }}
          username: ${{ secrets.MAC_MINI_SSH_USERNAME }}
          key: ${{ secrets.MAC_MINI_SSH_PRIVATE_KEY }}
          port: ${{ secrets.MAC_MINI_SSH_PORT }}
          script: |
            echo "=============================="
            echo "📦 최신 Docker 이미지 Pull 시작"
            echo "=============================="

            docker pull peekle/peekle-develop:latest

            echo "✅ Docker 이미지 Pull 완료"

            echo "=============================="
            echo "🧹 기존 컨테이너 정리 시작"
            echo "=============================="
            docker stop peekle-dev || true
            docker rm peekle-dev || true
            echo "✅ 기존 컨테이너 정리 완료"

            echo "=============================="
            echo "💪 env 파일 path로 이동"
            echo "=============================="
            echo "🫶 이동 전 디렉토리: $(pwd)"
            cd ${{ secrets.MAC_MINI_APP_DIRECTORY }}
            echo "✅ 현재 디렉토리: $(pwd)"

            echo "💪 Creating .env files"
            echo "${{ secrets.DOTENV_DEVELOPMENT }}" | awk 'NF' > .env
            echo "${{ secrets.DOTENV_DEFAULT }}" | awk 'NF' >> .env
            echo "✅ .env files created"

            echo "=============================="
            echo "🚀 새 컨테이너 실행 시작"
            echo "=============================="
            docker run \
              -d \
              -p ${{secrets.MAC_MINI_APP_PORT}}:7777 \
              --name peekle-dev \
              --restart always \
              --env-file .env \
              peekle/peekle-develop:latest

            echo "✅ 새 컨테이너 실행 완료"

            echo "=============================="
            echo "🎉 전체 프로세스 완료"
            echo "=============================="
